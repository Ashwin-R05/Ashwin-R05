<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="115" fill="url(#bgGrad)" stroke="#10B981" stroke-width="12" stroke-opacity="0.6"/>

  <!-- Graph Connection Lines (Edges) -->
  <g stroke="url(#edgeGrad)" stroke-width="6" stroke-opacity="0.75" stroke-dasharray="8,6">
    <line x1="256" y1="256" x2="150" y2="160"/>
    <line x1="256" y1="256" x2="360" y2="160"/>
    <line x1="256" y1="256" x2="130" y2="320"/>
    <line x1="256" y1="256" x2="380" y2="320"/>
    <line x1="256" y1="256" x2="256" y2="390"/>
    <line x1="150" y1="160" x2="256" y2="115"/>
    <line x1="360" y1="160" x2="256" y2="115"/>
    <line x1="130" y1="320" x2="256" y2="390"/>
    <line x1="380" y1="320" x2="256" y2="390"/>
  </g>

  <!-- NLP Waveform Accent around center -->
  <path d="M 190,256 Q 223,210 256,256 T 322,256" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Peripheral Knowledge Nodes -->
  <circle cx="256" cy="115" r="26" fill="#10B981" stroke="#ECFDF5" stroke-width="5" filter="url(#glow)"/>
  <circle cx="150" cy="160" r="28" fill="#A855F7" stroke="#FAF5FF" stroke-width="5" filter="url(#glow)"/>
  <circle cx="360" cy="160" r="28" fill="#06B6D4" stroke="#ECFEFF" stroke-width="5" filter="url(#glow)"/>
  <circle cx="130" cy="320" r="24" fill="#3B82F6" stroke="#EFF6FF" stroke-width="5" filter="url(#glow)"/>
  <circle cx="380" cy="320" r="24" fill="#EC4899" stroke="#FDF2F8" stroke-width="5" filter="url(#glow)"/>
  <circle cx="256" cy="390" r="25" fill="#14B8A6" stroke="#F0FDFA" stroke-width="5" filter="url(#glow)"/>

  <!-- Center Hub Node (Neural Core) -->
  <circle cx="256" cy="256" r="48" fill="#0F766E" stroke="#2DD4BF" stroke-width="8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="22" fill="#5EEAD4"/>
</svg>