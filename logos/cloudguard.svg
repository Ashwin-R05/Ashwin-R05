<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="115" fill="url(#bgGrad)" stroke="#0284C7" stroke-width="12" stroke-opacity="0.6"/>

  <!-- Stylized Cloud Silhouette -->
  <path d="M 170,300 L 130,300 C 95,300 70,270 70,235 C 70,205 92,180 120,175 C 130,130 170,95 220,95 C 265,95 305,125 315,168 C 325,164 336,162 348,162 C 385,162 416,190 418,226 C 438,235 452,255 452,280 C 452,310 425,335 395,335 L 342,335" 
        fill="none" stroke="url(#cloudGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Central Cyber Guard Shield -->
  <path d="M 256,190 L 336,225 L 336,325 C 336,380 256,415 256,415 C 256,415 176,380 176,325 L 176,225 Z" 
        fill="url(#shieldGrad)" stroke="#A7F3D0" stroke-width="8" filter="url(#glow)"/>

  <!-- Verified Check / Radar Emblem inside shield -->
  <path d="M 220,305 L 246,332 L 298,270" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Defensive Pulse Dots -->
  <circle cx="256" cy="145" r="9" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="176" cy="200" r="8" fill="#34D399"/>
  <circle cx="336" cy="200" r="8" fill="#34D399"/>
</svg>